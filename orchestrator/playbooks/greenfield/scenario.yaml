# GREENFIELD: a well-defined requirement for a new service.
# Demonstrates: full graph, parallel implementation/verification, change-control (new schema),
# an injected transient build failure recovered by bounded retry, and LLM->template doc fallback.
id: greenfield
title: Greenfield - build the URL shortener core service
kind: GREENFIELD
requirement: |
  Build a URL shortener service. A client submits a long http(s) URL and receives a short link;
  visiting the short link redirects to the original URL. Clients can optionally choose a custom alias,
  look up a link by its code, and list existing links. Invalid URLs must be rejected with a clear error
  and a duplicate alias must return a conflict.
baseline: []

faults:
  - stage: build-test
    execution: 1
    attempt: 1
    kind: RETRYABLE
    message: "Maven repository read timed out (simulated transient infrastructure failure)"

features:
  - id: core-links
    title: Create, look up and list short links with 302 redirect
    triggers: [short link, shorten, redirect, custom alias]
    acceptance:
      - "POST /api/v1/links returns 201 with code, shortUrl and Location header"
      - "GET /r/{code} returns 302 to the target with Cache-Control: private, no-store"
      - "GET /api/v1/links/{code} and paginated GET /api/v1/links return stored links"
      - "Non-http(s) or relative targets return 400 problem details; duplicate alias returns 409"
      - "Generated codes are random Base62 (not enumerable); collisions retried a bounded number of times"
    main:
      - url-shortener/pom.xml
      - url-shortener/mvnw
      - url-shortener/mvnw.cmd
      - url-shortener/.mvn/wrapper/maven-wrapper.properties
      - url-shortener/src/main/resources/application.yml
      - url-shortener/src/main/resources/db/migration/V1__create_short_links.sql
      - url-shortener/src/main/java/com/salian/shortener/UrlShortenerApplication.java
      - url-shortener/src/main/java/com/salian/shortener/config/ShortenerProperties.java
      - url-shortener/src/main/java/com/salian/shortener/config/ClockConfig.java
      - url-shortener/src/main/java/com/salian/shortener/link/ShortLink.java
      - url-shortener/src/main/java/com/salian/shortener/link/ShortLinkRepository.java
      - url-shortener/src/main/java/com/salian/shortener/link/CodeGenerator.java
      - url-shortener/src/main/java/com/salian/shortener/link/TargetUrlPolicy.java
      - url-shortener/src/main/java/com/salian/shortener/link/BasicTargetUrlPolicy.java
      - url-shortener/src/main/java/com/salian/shortener/link/InvalidTargetUrlException.java
      - url-shortener/src/main/java/com/salian/shortener/link/LinkNotFoundException.java
      - url-shortener/src/main/java/com/salian/shortener/link/AliasAlreadyExistsException.java
      - url-shortener/src/main/java/com/salian/shortener/link/CodeSpaceExhaustedException.java
      - url-shortener/src/main/java/com/salian/shortener/link/LinkService.java
      - path: url-shortener/src/main/java/com/salian/shortener/link/LinkResolvedEvent.java
        from: files/LinkResolvedEvent.v1.java
      - url-shortener/src/main/java/com/salian/shortener/web/dto/CreateLinkRequest.java
      - url-shortener/src/main/java/com/salian/shortener/web/dto/LinkResponse.java
      - url-shortener/src/main/java/com/salian/shortener/web/dto/PageResponse.java
      - url-shortener/src/main/java/com/salian/shortener/web/LinkController.java
      - path: url-shortener/src/main/java/com/salian/shortener/web/RedirectController.java
        from: files/RedirectController.v1.java
      - url-shortener/src/main/java/com/salian/shortener/web/GlobalExceptionHandler.java
    tests:
      - url-shortener/src/test/java/com/salian/shortener/link/CodeGeneratorTest.java
      - url-shortener/src/test/java/com/salian/shortener/link/BasicTargetUrlPolicyTest.java
      - url-shortener/src/test/java/com/salian/shortener/link/LinkServiceTest.java
      - url-shortener/src/test/java/com/salian/shortener/web/LinkControllerTest.java
      - url-shortener/src/test/java/com/salian/shortener/web/RedirectFlowIntegrationTest.java
