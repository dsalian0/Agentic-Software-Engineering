name: url-shortener

on:
  push:
    branches: [main, feature/agentic-engineering-assignment]
    paths: ["url-shortener/**", ".github/workflows/url-shortener-ci.yml"]
  pull_request:
    paths: ["url-shortener/**", ".github/workflows/url-shortener-ci.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: url-shortener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
